name: personal-site-dev

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: personal_site
      POSTGRES_USER: personal_site
      POSTGRES_PASSWORD: personal_site_dev
    ports:
      # 宿主机端口用 5433：本机已有一个原生 PostgreSQL 18 占着 5432。
      # 容器内部仍是 5432，compose 网络内（如 migrate 服务）继续用 postgres:5432。
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_site -d personal_site']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://personal_site:personal_site_dev@postgres:5432/personal_site?sslmode=disable
      - up

volumes:
  postgres-dev-data:
