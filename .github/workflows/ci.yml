name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace tools
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Lint OpenAPI
        uses: docker://dshanley/vacuum:v0.30.0
        with:
          args: lint /github/workspace/docs/api/openapi.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        run: corepack install --global pnpm@11.19.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Generate Go contract
        working-directory: server
        run: go generate ./...

      - name: Generate TypeScript contract
        run: pnpm exec openapi-typescript docs/api/openapi.yaml --output web/types/openapi.d.ts

      - name: Fail on generated drift
        run: git diff --exit-code -- server/generated/oapi/api.gen.go web/types/openapi.d.ts
