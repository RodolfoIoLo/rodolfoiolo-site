name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace tools
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Lint OpenAPI
        uses: docker://dshanley/vacuum:v0.30.0
        with:
          args: lint /github/workspace/docs/api/openapi.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Generate Go contract
        working-directory: server
        run: go generate ./...

      - name: Generate TypeScript contract
        run: pnpm exec openapi-typescript docs/api/openapi.yaml --output web/types/openapi.d.ts

      - name: Fail on generated drift
        run: git diff --exit-code -- server/generated/oapi/api.gen.go web/types/openapi.d.ts

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: personal_site
          POSTGRES_USER: personal_site
          POSTGRES_PASSWORD: personal_site_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_site -d personal_site"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://personal_site:personal_site_ci@localhost:5432/personal_site?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify modules
        working-directory: server
        run: go mod verify

      - name: Apply migrations
        run: >-
          docker run --rm --network host
          -v "$PWD/server/migrations:/migrations:ro"
          migrate/migrate:v4.17.1
          -path=/migrations
          -database="$TEST_DATABASE_URL"
          up

      - name: Generate test keys
        working-directory: server
        run: go run ./cmd/keygen ../secrets

      - name: Check formatting
        working-directory: server
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test with race detector
        working-directory: server
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Build commands
        working-directory: server
        run: |
          go build -trimpath -o bin/api ./cmd/api
          go build -trimpath -o bin/admin ./cmd/admin
          go build -trimpath -o bin/keygen ./cmd/keygen
