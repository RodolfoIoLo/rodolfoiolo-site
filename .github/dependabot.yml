version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # Remove once eslint-config-next's React plugin supports ESLint 10.
      # https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      - dependency-name: eslint
        versions: ['10.x']
      # Remove once typescript-eslint supports the TypeScript 7 compiler API.
      # https://typescript-eslint.io/users/dependency-versions/
      - dependency-name: typescript
        versions: ['7.x']
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
